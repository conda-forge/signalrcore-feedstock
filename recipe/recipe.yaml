schema_version: 1

context:
  version: "1.0.4"

package:
  name: signalrcore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/signalrcore/signalrcore-${{ version }}.tar.gz
  sha256: 51a0951e5103cb9c1c3262be9eac2bb9b79e12bb08b2b012fedd0d3f65b49592

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - msgpack-python ==1.2.4

tests:
  - python:
      imports:
        - signalrcore
        - signalrcore.hub
        - signalrcore.messages
        - signalrcore.protocol
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: A Python SignalR Core client, with invocation auth and two way streaming. Compatible with azure / serverless functions. Also with automatic reconnect and manually reconnect.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mandrewcito/signalrcore
  repository: https://github.com/mandrewcito/signalrcore

extra:
  recipe-maintainers:
    - synapticarbors
